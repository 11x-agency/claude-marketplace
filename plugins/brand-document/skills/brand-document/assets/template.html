<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{DOCUMENT_TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400;500;600&family=Lora:ital,wght@0,400..600;1,400..600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #f9f7f2;
      --ash-950: #21211e;
      --ash-700: #4a4a45;
      --ash-500: #7a7a73;
      --clay-600: #c14606;
      --clay-500: #d96409;
      --border: #e2dcd0;
      --border-subtle: #ece6da;
      --font-display: 'Grenze Gotisch', serif;
      --font-serif:   'Lora', 'Times New Roman', serif;
      --font-mono:    'JetBrains Mono', monospace;
    }

    @page { size: A4; margin: 0; }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--cream);
      color: var(--ash-950);
      font-family: var(--font-serif);
      font-weight: 400;
      line-height: 1.7;
      font-size: 14px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ---- Page template ---- */
    .page {
      width: 210mm;
      height: 297mm;
      background: var(--cream);
      position: relative;
      overflow: hidden;
      page-break-after: always;
      display: flex;
      flex-direction: column;
    }

    .page:last-child { page-break-after: auto; }

    .top-rule {
      position: relative;
      padding: 32px 56px 0;
      flex-shrink: 0;
      z-index: 2;
      height: 64px;
    }
    .top-rule__logotype {
      height: 22px;
      width: auto;
      object-fit: contain;
      display: block;
      position: absolute;
      left: 56px;
      bottom: 14px;
      z-index: 2;
    }
    .top-rule__line {
      position: absolute;
      left: 96px;
      right: 56px;
      bottom: 14px;
      height: 2px;
      background: var(--clay-600);
    }
    .top-rule__line-bottom {
      position: absolute;
      left: 56px;
      right: 56px;
      bottom: 8px;
      height: 2px;
      background: var(--clay-600);
    }

    .page-content {
      flex: 1;
      padding: 24px 56px 24px;
      display: flex;
      flex-direction: column;
    }

    .page-footer {
      padding: 0 56px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .page-footer-logo img {
      height: 18px;
      display: block;
    }

    .page-footer-num {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ash-500);
      letter-spacing: 0.1em;
    }

    /* ---- Typography ---- */
    .section-prefix {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 400;
      color: var(--clay-600);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .kicker {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 2.2rem;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--clay-600);
      align-self: flex-start;
      margin-bottom: 20px;
      padding-bottom: 2px;
      border-bottom: 2px solid var(--clay-600);
    }

    h1 {
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: 3.4rem;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--ash-950);
      margin-bottom: 24px;
    }

    h2 {
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: 2rem;
      letter-spacing: -0.02em;
      color: var(--ash-950);
      margin-bottom: 14px;
    }

    h3 {
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: 1.3rem;
      letter-spacing: -0.01em;
      color: var(--ash-950);
      margin-bottom: 8px;
    }

    p {
      color: var(--ash-700);
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.7;
    }

    p:last-child { margin-bottom: 0; }

    .lead {
      font-size: 16px;
      color: var(--ash-700);
      margin-bottom: 28px;
    }

    /* ---- Meta info ---- */
    .meta {
      display: flex;
      gap: 40px;
      margin: 28px 0;
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .meta-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ash-500);
    }

    .meta-value {
      font-family: var(--font-serif);
      font-size: 14px;
      color: var(--ash-950);
      font-weight: 500;
    }

    /* ---- Divider ---- */
    .divider {
      height: 1px;
      background: var(--clay-600);
      margin: 28px 0;
      border: none;
    }

    /* ---- Card grid (2 columns) ---- */
    .card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border-subtle);
      border: 1px solid var(--border-subtle);
      margin: 20px 0;
    }

    .card {
      background: var(--cream);
      padding: 24px;
    }

    .card .card-label {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--clay-600);
      margin-bottom: 10px;
    }

    .card h3 { margin-bottom: 6px; }
    .card p { font-size: 13px; margin-bottom: 0; }

    /* ---- Status grid (3 columns) ---- */
    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1px;
      background: var(--border-subtle);
      border: 1px solid var(--border-subtle);
      margin: 20px 0;
    }

    .status-card {
      background: var(--cream);
      padding: 24px 20px;
      text-align: center;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--clay-600);
      margin: 0 auto 12px;
    }

    .status-card h3 { font-size: 1.05rem; margin-bottom: 6px; }
    .status-card p { font-size: 12px; margin-bottom: 0; }

    /* ---- Flow steps ---- */
    .flow {
      margin: 20px 0;
      padding: 28px;
      border: 1px solid var(--border-subtle);
    }

    .flow-step {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 22px;
      position: relative;
    }

    .flow-step:last-child { margin-bottom: 0; }

    .flow-step::before {
      content: '';
      position: absolute;
      left: 14px;
      top: 30px;
      bottom: -22px;
      width: 1px;
      background: var(--border);
    }

    .flow-step:last-child::before { display: none; }

    .flow-number {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--clay-600);
      min-width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--clay-600);
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--cream);
    }

    .flow-content h3 { font-size: 1.05rem; margin-bottom: 3px; }
    .flow-content p { font-size: 13px; margin-bottom: 0; }

    /* ---- Questions list ---- */
    .questions {
      list-style: none;
      margin: 16px 0;
      counter-reset: q;
    }

    .questions li {
      counter-increment: q;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      gap: 14px;
      align-items: baseline;
    }

    .questions li:last-child { border-bottom: none; }

    .questions li::before {
      content: "[ 0" counter(q) " ]";
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--clay-600);
      letter-spacing: 0.1em;
      flex-shrink: 0;
    }

    .questions li span { color: var(--ash-700); font-size: 13px; }
    .questions li strong { color: var(--ash-950); font-weight: 500; }

    /* ---- Pills ---- */
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 20px 0;
    }

    .pill {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--ash-950);
      padding: 6px 16px;
      border: 1px solid var(--clay-600);
      border-radius: 9999px;
    }

    /* ---- Utilities ---- */
    .spacer { flex: 1; }
    .spacer-sm { height: 24px; flex-shrink: 0; }
    .spacer-md { height: 40px; flex-shrink: 0; }
  </style>
</head>
<body>

<!-- PAGE 1: Cover -->
<div class="page">
  <div class="top-rule">
    <img class="top-rule__logotype" src="logotype-11x.svg" alt="11x" />
    <span class="top-rule__line"></span>
    <span class="top-rule__line-bottom"></span>
  </div>
  <div class="page-content">
    <div class="kicker">{{KICKER}}</div>
    <h1>{{TITLE}}</h1>
    <p class="lead">{{LEAD_TEXT}}</p>

    <div class="meta">
      <div class="meta-item">
        <span class="meta-label">Client</span>
        <span class="meta-value">{{CLIENT}}</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Date</span>
        <span class="meta-value">{{DATE}}</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Scope</span>
        <span class="meta-value">{{SCOPE}}</span>
      </div>
    </div>

    <hr class="divider">

    <!-- First section starts here on the cover page -->
    <div class="section-prefix">// 01 {{SECTION_NAME}}</div>
    <h2>{{Section heading}}</h2>
    <p>{{Section content}}</p>

    <div class="spacer"></div>
  </div>

  <div class="page-footer">
    <div class="page-footer-logo">
      <img src="logotype-11x.svg" alt="11x" />
    </div>
    <div class="page-footer-num">1 / {{TOTAL_PAGES}}</div>
  </div>
</div>

<!-- PAGE 2+: Content pages -->
<div class="page">
  <div class="top-rule">
    <img class="top-rule__logotype" src="logotype-11x.svg" alt="11x" />
    <span class="top-rule__line"></span>
    <span class="top-rule__line-bottom"></span>
  </div>
  <div class="page-content">

    <!-- Sections go here. Use <hr class="divider"> between sections on the same page. -->

    <div class="spacer"></div>
  </div>
  <div class="page-footer">
    <div class="page-footer-logo">
      <img src="logotype-11x.svg" alt="11x" />
    </div>
    <div class="page-footer-num">2 / {{TOTAL_PAGES}}</div>
  </div>
</div>

</body>
</html>
